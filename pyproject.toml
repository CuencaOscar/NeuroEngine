[project]
name = "neuroengine"
version = "1.0.0"
description = "REST API that classifies brain MRI images into four Alzheimer stages (research project)."
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint.per-file-ignores]
"research/**" = ["E", "F", "I", "B", "UP"]
